name: Build Windows App

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned to windows-2022 (Visual Studio 2022). "windows-latest" rolled to a
    # newer image whose Visual Studio 18 isn't recognized by node-gyp, which
    # broke the native better-sqlite3 build during npm install.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22, not 20: jsdom 30 pulls an undici that calls
          # webidl.util.markAsUncloneable, which does not exist on Node 20, so
          # the harness cannot even load there. Electron ships its own Node, so
          # this only sets the toolchain the build and harness run under.
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # The harness runs the real renderer under jsdom against the real SQLite
      # layer. It is the only automated check the app has, so a red harness must
      # stop the build rather than ship a broken installer.
      - name: Run UI harness
        run: node scripts/ui-harness.mjs

      - name: Read version from package.json
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build Windows installer + portable exe
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        shell: bash
        run: ls -la release/ || dir release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MMW-Windows-${{ steps.ver.outputs.version }}
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-build.${{ github.run_number }}
          name: Mission Minded v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          prerelease: true
          make_latest: true
          body: |
            ## Mission Minded Worldwide — Free Clinic Patient Records (v${{ steps.ver.outputs.version }})

            Offline-first patient records for MMW's free dental, medical and vision
            clinics. Windows desktop app. **Download the installer once — it
            auto-updates from here on.**

            > **Early preview (v${{ steps.ver.outputs.version }}).** Carried over from the Caring
            > Hands codebase and rebranded to MMW. It has not yet been used in a live
            > clinic, and the consent wording has not been through legal review. Do not
            > rely on it for patient records until it has.

            ### New in this build
            - **First-run setup.** There is no shipped `admin/admin` any more. The
              first person to open the app creates the administrator and chooses the
              password; a second laptop picks **Join a clinic already set up**, points
              at the same clinic cloud, and everyone signs in with their own account.
            - **MMW colours and type.** The palette is sampled from the printed
              Patient Record — cyan `#00BBD0`, Clearance magenta `#C356A0`, Dental
              green `#8DC63F` — and the lockup is set in Copperplate Gothic, the
              letterhead face from MMW's consent form, with Arial for everything else.

            ### Also in the app
            - **Registration** issues a 6-digit patient ID and prints a **Code 128
              wristband**. Every later station starts by scanning that band.
            - **Clearance** records the four vitals from the printed MMW record —
              blood pressure, blood sugar, pulse and respiration — plus allergies,
              medications and medical history, then routes to cleaning or x-ray.
            - **Dental** covers triage, the odontogram, fillings, extractions,
              cleanings and anaesthetic, with a signed treatment note.
            - **Check-out**, **Records** and **Reports**, including de-identified
              event totals that survive a patient-data purge.
            - MMW's own **consent wording** — the Patient Application and Consent for
              Health Care, and the Consent for Oral Surgery.
            - Optional **cloud sync** between laptops at the same clinic, and offline
              USB update/transfer when there is no network.

            ### Downloads
            - **MMW-Setup-${{ steps.ver.outputs.version }}.exe** — installer (recommended; required for auto-update).
            - **MMW-Portable-${{ steps.ver.outputs.version }}.exe** — portable, runs without installing (no auto-update).

            Windows may warn that the publisher is unknown — the build is not code-signed.
            Choose **More info → Run anyway**.
          # Without this the release is created with a body and no downloads.
          # latest.yml and the blockmap are what electron-updater reads to offer
          # an in-app update, so they ship alongside the installers.
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
