# Filename kept as build-windows.yml although this now builds macOS too:
# renaming it would start a NEW workflow whose github.run_number restarts at 1,
# and the release tag is v<version>-build.<run_number>. Tags would go backwards
# past the ones already published.
name: Build Desktop Apps

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- Windows --
  windows:
    # Pinned to windows-2022 (Visual Studio 2022). "windows-latest" rolled to a
    # newer image whose Visual Studio 18 isn't recognized by node-gyp, which
    # broke the native better-sqlite3 build during npm install.
    runs-on: windows-2022
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22, not 20: jsdom 30 pulls an undici that calls
          # webidl.util.markAsUncloneable, which does not exist on Node 20, so
          # the harness cannot even load there. Electron ships its own Node, so
          # this only sets the toolchain the build and harness run under.
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # The harness runs the real renderer under jsdom against the real SQLite
      # layer. It is the only automated check the app has, so a red harness must
      # stop the build rather than ship a broken installer.
      - name: Run UI harness
        run: node scripts/ui-harness.mjs

      - name: Read version from package.json
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build Windows installer + portable exe
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        shell: bash
        run: ls -la release/

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------ macOS --
  # ONE JOB PER ARCHITECTURE, on purpose.
  #
  # Both architectures in a single job shared node_modules, and @electron/rebuild
  # did not redo better-sqlite3 for the second one: build 13 shipped an arm64 app
  # whose native SQLite module was x86_64, which crashes on launch on every Apple
  # Silicon Mac. A separate job per arch gets a clean npm install and cannot
  # inherit the other's binary. It also puts the two hdiutil runs on different
  # machines, so they can no longer collide over a mounted volume.
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            expect: x86_64
            volume: Mission Minded Intel
          - arch: arm64
            expect: arm64
            volume: Mission Minded Apple Silicon
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # node-gyp's bundled gyp still does "from distutils.version import
      # StrictVersion", and distutils was removed from the Python stdlib in
      # 3.12 — which is older than the runner's default python3. Building the
      # x64 slice of better-sqlite3 from source therefore dies before it
      # compiles anything. 3.11 is the last release that still ships distutils.
      - name: Pin Python 3.11 for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install

      # Run the gate here too. It exercises the data layer and the whole
      # renderer, so it is also the only thing standing between a macOS-specific
      # path bug and a shipped DMG.
      - name: Run UI harness
        run: node scripts/ui-harness.mjs

      # A non-zero exit is tolerated: electron-builder writes the image AND its
      # blockmap, then fails on "hdiutil detach" of its own temporary volume,
      # which on a headless runner has no Finder session to release it. That is
      # cleanup failing after the artifact exists. The checks below are what
      # actually decide whether this job passed.
      #
      # CSC_IDENTITY_AUTO_DISCOVERY=false: there is no Apple Developer ID here,
      # and without it electron-builder searches the runner's keychain, finds
      # nothing, and reports a signing error rather than the deliberate choice
      # it is. The app is still ad-hoc signed, which Apple Silicon requires in
      # order to launch a binary at all.
      - name: Build macOS DMG (${{ matrix.arch }})
        run: npm run dist:mac:${{ matrix.arch }} || echo "electron-builder exited non-zero — the checks below decide"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Release any volume left mounted
        if: always()
        run: hdiutil detach -force "/Volumes/${{ matrix.volume }}" 2>/dev/null || true

      # The real gate. Existence, integrity, and — the one that caught build 13 —
      # that the app AND its native module are both the architecture this DMG
      # claims to be.
      - name: Verify the DMG
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          DMG="release/MMW-$V-${{ matrix.arch }}.dmg"
          ls -la release/
          test -s "$DMG" || { echo "::error::$DMG missing or empty"; exit 1; }
          # Exactly one. Pinning arch in the build config made a single
          # invocation build both and race itself in hdiutil, keeping whichever
          # finished first — so this job could emit the other architecture's
          # image under its own name.
          n=$(ls release/*.dmg | wc -l | tr -d ' ')
          test "$n" = "1" || { echo "::error::expected one DMG from this job, found $n"; ls release/*.dmg; exit 1; }
          hdiutil verify "$DMG"

          MP=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MP" "$DMG"
          APP="$MP/Mission Minded.app"
          BIN="$APP/Contents/MacOS/Mission Minded"
          NODE=$(find "$APP" -name 'better_sqlite3.node' | head -1)
          echo "app:    $(file -b "$BIN")"
          echo "sqlite: $(file -b "$NODE")"
          rc=0
          file -b "$BIN"  | grep -q '${{ matrix.expect }}' || { echo "::error::app binary is not ${{ matrix.expect }}"; rc=1; }
          file -b "$NODE" | grep -q '${{ matrix.expect }}' || { echo "::error::better_sqlite3.node is not ${{ matrix.expect }} — this build would crash on launch"; rc=1; }
          test -n "$NODE" || { echo "::error::no native module found in the bundle"; rc=1; }
          hdiutil detach -force "$MP" >/dev/null 2>&1 || true
          exit $rc

      - name: Upload macOS build (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30

  # ----------------------------------------------------------------- Release --
  # Separate job so ONE release carries both platforms. Two build jobs each
  # publishing to the same tag would race, and a half-published release (Windows
  # up, macOS still building) is worse than none. `needs` both means a failure
  # on either platform publishes nothing.
  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          # Both artifacts flattened into one directory, so the glob below is
          # a single list rather than per-platform paths.
          merge-multiple: true

      - name: List everything being published
        run: ls -la dist/

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}-build.${{ github.run_number }}
          name: Mission Minded v${{ needs.windows.outputs.version }} (build ${{ github.run_number }})
          # NOT a prerelease. GitHub excludes prereleases from /releases/latest,
          # and electron-updater (allowPrerelease defaults to false) asks for
          # exactly that endpoint — so flagging these as prereleases meant every
          # install failed its update check with "please ensure a production
          # release exists". The preview status is communicated in the notes
          # below, which is the right place for it; the flag silently breaks the
          # update channel. make_latest is also ignored for prereleases, so it
          # only starts doing its job here.
          prerelease: false
          make_latest: true
          body: |
            ## Mission Minded Worldwide — Free Clinic Patient Records (v${{ needs.windows.outputs.version }})

            Offline-first patient records for MMW's free dental, medical and vision
            clinics. **Download once — Windows auto-updates from here on.**

            > **Early preview (v${{ needs.windows.outputs.version }}).** Carried over from the Caring
            > Hands codebase and rebranded to MMW. It has not yet been used in a live
            > clinic, and the consent wording has not been through legal review. Do not
            > rely on it for patient records until it has.

            ### New in this build — Dr. Trinh's punch list

            **Before you install — read this.** Update **every** laptop to this
            version together, and re-paste `cloud/worker.js` into Cloudflare
            (docs/CLOUD_SETUP.md step 3) if you use the online pre-registration
            link. Older laptops cannot show the new medical history or the
            Treatment Waiting stage, and an old online form cannot submit.

            **Medical history is Dr. Trinh's form.** Every question is required
            and answered from a dropdown or a checklist — nothing typed except
            "Other". The 25 conditions are each Yes / No / Unsure (pregnancy also
            Not applicable). Medication allergies start with No known allergies /
            Yes / Unsure, then his 24-item list. Current medications are his
            25-item checklist, with Other for anything unlisted. "Hospitalized in
            the last 2 years" is now **major surgery in the past 6 months**, with
            where. "Do you use tobacco" is now **Do you smoke?** Older records
            keep showing exactly what was recorded.

            **Step 3 asks the eight pain questions** (cold, hot, eating, toothache
            at night, touching, clenching or grinding at night, waking with jaw
            pain, lumps or sores). "When did you last see a dentist" and "What do
            you need today" stay — they route the patient and trigger the
            oral-surgery consent.

            **The survey moved to check-out.** Registration no longer has a
            survey step (check-in is five steps). All 34 questions from Dr.
            Trinh's survey are asked at check-out, as dropdowns; answers given at
            an earlier registration are pre-filled for the patient to confirm.

            **City is a dropdown.** Under Admin → Events, list the towns your
            clinic serves; check-in and the online form then offer them, with
            Other for anyone else. Leave the list empty and City stays a text box.

            **Dentist is now Dental Triage.** Number of X-rays taken replaces the
            X-ray station. **Move Patient to Treatment Waiting** parks an examined
            patient for a treatment chair; the screen lists Dental Triage,
            Treatment waiting and In treatment separately. Filling surfaces are
            M, F, L, O, B. The anesthetic injection site is a dropdown. The
            Services section is replaced by **Referral** (where to, how urgent,
            tooth, reason).

            **Vitals.** The EMT review questions are gone. The patient's health
            history is open on the Vitals screen and can be edited there, or
            marked "Reviewed with patient — no changes"; the record shows who
            reviewed it.

            **Patient information at every station.** Arrivals, Vitals, Dental
            Triage, Hygienist, Check-out and Records all show the patient's
            information and history, editable by role.

            **Locking.** A signed-off record is read-only. An administrator can
            **Unlock to amend** (a reason is required and kept) and **Lock** it
            again, including finished visits that were never locked.

            **Follow-up care instructions.** Check-out prints after-care matched
            to what was actually done — extraction, surgical extraction,
            fillings, cleaning, numbness, referral and more — in the patient's
            language (English or Spanish), and it is added to the visit summary.

            **Fixed along the way:** the dentist's Restorative and Services
            entries never synced to other laptops and were wiped when a
            hygienist saved; glucose and respiration never left the laptop they
            were taken on; a laptop syncing an older copy could overwrite newer
            work; the consent's after-hours number was a leftover Oregon number
            and now reads MMW's (951) 317-4968.

            **Waiting on MMW:** the injection-site list and anesthetic list are
            placeholders until MMW's lists arrive, and the after-care wording is
            a draft (marked on every sheet) until Dr. Trinh's templates replace it.

            ### Signing in
            Every install now comes with an administrator already set up:

            | Username | Password |
            | --- | --- |
            | `admin` | `admin` |

            **Change that password before the clinic sees real patients.** It is
            the same on every copy and it is written here, so anyone who reaches
            the laptop can open every patient record on it. The app says so on the
            sign-in screen and on a banner across every screen until you change it
            — both disappear once you do. Change it under **Admin → Staff & roles**.

            ### Downloads

            **Windows**
            - **MMW-Setup-${{ needs.windows.outputs.version }}.exe** — installer (recommended; required for auto-update).
            - **MMW-Portable-${{ needs.windows.outputs.version }}.exe** — portable, runs without installing.

            **macOS** — pick the one that matches your Mac ( → About This Mac):
            - **MMW-${{ needs.windows.outputs.version }}-arm64.dmg** — Apple Silicon (M1/M2/M3/M4).
            - **MMW-${{ needs.windows.outputs.version }}-x64.dmg** — Intel.

            ### Opening the app the first time
            Neither build is code-signed, so both operating systems will warn you.

            **Windows** — "Windows protected your PC" → **More info → Run anyway**.

            **macOS** — open the DMG, drag **Mission Minded** to Applications, then
            launch it from Applications. macOS will say it *"cannot be opened
            because Apple cannot check it for malicious software"*. Click **Done**,
            then go to  **→ System Settings → Privacy & Security**, scroll down,
            and press **Open Anyway** beside the Mission Minded message. Confirm
            once more and it opens normally from then on.

            > macOS auto-update is **not** available — updating a Mac app requires
            > an Apple-signed build. Mac users download each new version from this
            > page. Windows continues to update itself in place.

            ### From v0.0.3 — security
            Builds up to and including v0.0.2 shipped a hard-coded sync server and
            key belonging to the organisation this app was forked from, and
            connected to it at startup. v0.0.3 removed it, refuses that endpoint,
            and erases any records an affected machine is holding on first launch.
            **Do not keep using v0.0.1 or v0.0.2.**
          # latest.yml and the blockmaps are what electron-updater reads to offer
          # an in-app update, so they ship alongside the installers.
          files: |
            dist/*.exe
            dist/*.dmg
            dist/latest.yml
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
