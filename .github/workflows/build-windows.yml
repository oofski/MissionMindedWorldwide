name: Build Windows App

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned to windows-2022 (Visual Studio 2022). "windows-latest" rolled to a
    # newer image whose Visual Studio 18 isn't recognized by node-gyp, which
    # broke the native better-sqlite3 build during npm install.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22, not 20: jsdom 30 pulls an undici that calls
          # webidl.util.markAsUncloneable, which does not exist on Node 20, so
          # the harness cannot even load there. Electron ships its own Node, so
          # this only sets the toolchain the build and harness run under.
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # The harness runs the real renderer under jsdom against the real SQLite
      # layer. It is the only automated check the app has, so a red harness must
      # stop the build rather than ship a broken installer.
      - name: Run UI harness
        run: node scripts/ui-harness.mjs

      - name: Read version from package.json
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build Windows installer + portable exe
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        shell: bash
        run: ls -la release/ || dir release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MMW-Windows-${{ steps.ver.outputs.version }}
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-build.${{ github.run_number }}
          name: Mission Minded v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          # NOT a prerelease. GitHub excludes prereleases from /releases/latest,
          # and electron-updater (allowPrerelease defaults to false) asks for
          # exactly that endpoint — so flagging these as prereleases meant every
          # install failed its update check with "please ensure a production
          # release exists". The preview status is communicated in the notes
          # below, which is the right place for it; the flag silently breaks the
          # update channel. make_latest is also ignored for prereleases, so it
          # only starts doing its job here.
          prerelease: false
          make_latest: true
          body: |
            ## Mission Minded Worldwide — Free Clinic Patient Records (v${{ steps.ver.outputs.version }})

            Offline-first patient records for MMW's free dental, medical and vision
            clinics. Windows desktop app. **Download the installer once — it
            auto-updates from here on.**

            > **Early preview (v${{ steps.ver.outputs.version }}).** Carried over from the Caring
            > Hands codebase and rebranded to MMW. It has not yet been used in a live
            > clinic, and the consent wording has not been through legal review. Do not
            > rely on it for patient records until it has.

            ### New in this build
            - **Modernised across every screen.** Softer geometry, layered
              elevation, roomier spacing and pill controls, applied at the token
              level so all thirteen screens move together. All motion still
              respects `prefers-reduced-motion`.
            - **Patient journey** on the dashboard: where everyone on the floor is
              right now — Registered, Clearance, Ready, Treatment, Checked out —
              with a completion ring replacing the old checked-out tile.
            - **The printed forms now map onto the app.** The Dental half of the
              Patient Record gains its missing **Restorative** (core build-up,
              re-cement crown, denture, bridge) and **Services** (alveoplasty,
              IRM, buccal, pulpotomy) blocks, which previously had nowhere to go
              but a free-text box and so could never be counted in a report.
            - **The HIV / Hepatitis B & C deemed-consent answer is now recorded.**
              The consent showed the wording but never captured the patient's
              Yes/No, so a signed consent could not evidence what was agreed. It
              is asked at registration and required before signing.
            - **Fixed:** consents signed at check-in silently dropped their tooth
              numbers, so an oral-surgery consent did not record which teeth it
              covered. Consents added later at the chair were unaffected.

            ### From v0.0.3 — security
            Builds up to and including v0.0.2 shipped a hard-coded sync server and
            key belonging to the organisation this app was forked from, and
            connected to it at startup. v0.0.3 removed it, refuses that endpoint,
            and erases any records an affected machine is holding on first launch.
            **Do not keep using v0.0.1 or v0.0.2.**

            ### Downloads
            - **MMW-Setup-${{ steps.ver.outputs.version }}.exe** — installer (recommended; required for auto-update).
            - **MMW-Portable-${{ steps.ver.outputs.version }}.exe** — portable, runs without installing (no auto-update).

            Windows may warn that the publisher is unknown — the build is not code-signed.
            Choose **More info → Run anyway**.
          # Without this the release is created with a body and no downloads.
          # latest.yml and the blockmap are what electron-updater reads to offer
          # an in-app update, so they ship alongside the installers.
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
