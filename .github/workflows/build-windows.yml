name: Build Windows App

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned to windows-2022 (Visual Studio 2022). "windows-latest" rolled to a
    # newer image whose Visual Studio 18 isn't recognized by node-gyp, which
    # broke the native better-sqlite3 build during npm install.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # The harness runs the real renderer under jsdom against the real SQLite
      # layer. It is the only automated check the app has, so a red harness must
      # stop the build rather than ship a broken installer.
      - name: Run UI harness
        run: node scripts/ui-harness.mjs

      - name: Read version from package.json
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build Windows installer + portable exe
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        shell: bash
        run: ls -la release/ || dir release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MMW-Windows-${{ steps.ver.outputs.version }}
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-build.${{ github.run_number }}
          name: Mission Minded v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          prerelease: true
          make_latest: true
          body: |
            ## Mission Minded Worldwide — Free Clinic Patient Records (v${{ steps.ver.outputs.version }})

            Offline-first patient records for MMW's free dental, medical and vision
            clinics. Windows desktop app. **Download the installer once — it
            auto-updates from here on.**

            > **Early preview (v${{ steps.ver.outputs.version }}).** This is a first cut carried over
            > from the Caring Hands codebase and rebranded to MMW. It has not yet been
            > used in a live clinic, and the consent wording has not been through legal
            > review. Do not rely on it for patient records until it has.

            ### What's in this build
            - **Registration** issues a 6-digit patient ID and prints a **Code 128
              wristband**. Every later station starts by scanning that band.
            - **Clearance** records the four vitals from the printed MMW record —
              blood pressure, blood sugar, pulse and respiration — plus allergies,
              medications and medical history, then routes to cleaning or x-ray.
            - **Dental** covers triage, the odontogram, fillings, extractions,
              cleanings and anaesthetic, with a signed treatment note.
            - **Check-out**, **Records** and **Reports**, including de-identified
              event totals that survive a patient-data purge.
            - MMW's own **consent wording** — the Patient Application and Consent for
              Health Care, and the Consent for Oral Surgery.
            - Optional **cloud sync** between laptops at the same clinic, and offline
              USB update/transfer when there is no network.

            ### Downloads
            - **MMW-Setup-${{ steps.ver.outputs.version }}.exe** — installer (recommended; required for auto-update).
            - **MMW-Portable-${{ steps.ver.outputs.version }}.exe** — portable, runs without installing (no auto-update).

            Windows may warn that the publisher is unknown — the build is not code-signed.
            Choose **More info → Run anyway**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
